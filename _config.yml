title: "Charles Almeida"
url: "https://charlesalmd.github.io"
baseurl: ""

# Inglês na raiz, português em /pt/. Cada página declara `lang` e `ref`;
# páginas com o mesmo `ref` são versões uma da outra (seletor de idioma e hreflang).
lang: en

markdown: kramdown
kramdown:
  input: GFM
  math_engine: null

permalink: pretty

defaults:
  - scope: {path: ""}
    values: {layout: pagina, lang: en}
  - scope: {path: "pt"}
    values: {lang: pt}
  - scope: {path: "pt/ensino"}
    values: {lang: pt, alt_ref: teaching}

exclude:
  - CLAUDE.md
  - PENDENCIAS.md
  - revisao-traducoes.md
  - README.md
  - Gemfile
  - Gemfile.lock
  - migracao/
  - design/
  - vendor/
  - .bundle/
  - .github/
