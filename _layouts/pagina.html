---
layout: default
---
<main id="conteudo" class="pagina">
  <div class="wrap">
    <header class="pagina-topo">
      <h1>{{ page.title }}</h1>
      {%- if page.subtitle %}
      <p class="pagina-sub">{{ page.subtitle }}</p>
      {%- endif %}
    </header>
    <div class="texto">
      {{ content }}
    </div>
  </div>
</main>
