recruiting:
  # Um item por parágrafo. EN: texto do protótipo atual; Charles revisa.
  pt:
    - >-
      Oriento alunos de mestrado e doutorado em geometria algébrica. Alunos interessados devem ter
      formação sólida em álgebra e são incentivados a cursar Geometria Algébrica e Álgebra Comutativa.
      Recomendo entrar em contato durante ou após essas disciplinas, para discutirmos possíveis
      direções de pesquisa.
    - "No momento, não estou aceitando novos alunos de iniciação científica."
  en:
    - >-
      I supervise master's and PhD students in algebraic geometry. Prospective students should have a
      solid background in algebra and are encouraged to take the courses in Algebraic Geometry and
      Commutative Algebra. I suggest getting in touch during or after those courses, so we can discuss
      possible research directions.
    - "I am not currently taking new undergraduate research students."
