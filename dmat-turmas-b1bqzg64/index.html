<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="robots" content="noindex, nofollow">
<title>Quadro de Turmas do DMAT</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,700&family=Instrument+Sans:wght@400;500;600&display=swap">
<style>
:root { --bg: #f3f5f1; --surface: #ffffff; --ink: #16201b; --muted: #5a6860; --line: #dce3dc; --board: #1e4d3c; --board-ink: #f2f6ef; --board-muted: #b9cfc3; --accent: #1f6b52; --bad: #b8372b; --hi: #b97a00; }
@media (prefers-color-scheme: dark) { :root { --bg: #0e1411; --surface: #151d18; --ink: #e6ece7; --muted: #9aa99f; --line: #2a362f; --board: #143628; --board-ink: #eef4ec; --board-muted: #9fbcae; --accent: #5ec39a; --bad: #f0705f; --hi: #f0b52c; color-scheme: dark; } }
* { box-sizing: border-box; }
html, body { height: 100%; }
body { margin: 0; background: var(--bg); color: var(--ink); font-family: "Instrument Sans", system-ui, -apple-system, "Segoe UI", sans-serif; font-size: 15px; display: grid; grid-template-rows: auto 1fr; }
header { background: var(--board); color: var(--board-ink); padding: 28px max(16px, env(safe-area-inset-left, 0px)) 24px max(16px, env(safe-area-inset-right, 0px)); }
header .in { max-width: 1180px; margin: 0 auto; }
h1 { font-family: "Bricolage Grotesque", "Instrument Sans", system-ui, sans-serif; font-size: clamp(28px, 4.2vw, 42px); margin: 0; line-height: 1.05; }
header p { color: var(--board-muted); margin: 8px 0 0; }
main { display: grid; place-items: start center; padding: 40px max(16px, env(safe-area-inset-left, 0px)) 40px max(16px, env(safe-area-inset-right, 0px)); }
form { width: 100%; max-width: 380px; background: var(--surface); border: 1px solid var(--line); border-radius: 12px; padding: 22px; display: grid; gap: 14px; }
form h2 { margin: 0; font-size: 18px; }
label { display: grid; gap: 5px; font-size: 13px; font-weight: 600; color: var(--muted); }
input[type="text"], input[type="password"] { font: inherit; color: var(--ink); background: var(--bg); border: 1px solid var(--line); border-radius: 8px; padding: 10px 12px; }
.check { display: flex; gap: 8px; align-items: center; font-weight: 500; }
button { font: inherit; font-weight: 600; background: var(--accent); color: var(--surface); border: 0; border-radius: 8px; padding: 11px; cursor: pointer; }
button:disabled { opacity: .6; cursor: wait; }
.err { color: var(--bad); font-size: 14px; min-height: 1.2em; margin: 0; }
:focus-visible { outline: 2px solid var(--hi); outline-offset: 2px; }
[hidden] { display: none !important; }
</style>
</head>
<body>
<header><div class="in"><h1>Quadro de Turmas do DMAT</h1><p>Acesso restrito ao Departamento de Matemática.</p></div></header>
<main>
  <form id="f" autocomplete="on">
    <h2>Entrar</h2>
    <label for="u">Usuário<input id="u" name="username" type="text" autocomplete="username" autocapitalize="none" spellcheck="false" required></label>
    <label for="s">Senha<input id="s" name="password" type="password" autocomplete="current-password" required></label>
    <label class="check" for="lembrar"><input id="lembrar" type="checkbox"> Lembrar neste computador</label>
    <button id="b" type="submit">Entrar</button>
    <p class="err" id="e" role="alert"></p>
  </form>
</main>
